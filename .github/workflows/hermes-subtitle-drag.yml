name: Hermes subtitle drag build

on:
  workflow_dispatch:
  push:
    branches:
      - hermes/subtitle-drag

permissions:
  contents: read

jobs:
  build:
    name: Standard release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build standard release APKs
        run: ./gradlew "assembleStandardRelease" --stacktrace --no-daemon --max-workers=2

      - name: Sign APKs
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore hermes.keystore -alias hermes \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass hermesdrag -keypass hermesdrag \
            -dname "CN=mpvRx Hermes Build"
          apksigner="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          mkdir -p out
          shopt -s nullglob
          for apk in app/build/outputs/apk/standard/release/*.apk; do
            "$apksigner" sign --ks hermes.keystore --ks-key-alias hermes \
              --ks-pass pass:hermesdrag --key-pass pass:hermesdrag "$apk"
            cp "$apk" out/
          done
          rm -f hermes.keystore
          ls -la out/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mpvrx-subtitle-drag-apks
          if-no-files-found: error
          path: out/*.apk
